name: Docker
on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: docker.io
  IMAGE_NAME: invarianttech/client

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # required for cosign keyless

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install cosign (skip on PRs)
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Resolve package and Python versions
        id: versions
        run: |
          set -euo pipefail

          PYTHON_VERSION=$(python3 -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')

          pip install --disable-pip-version-check --quiet invariant-client
          INVARIANT_VERSION=$(invariant version | awk '/^client:/ {print $2}' | sed 's/^v//')

          echo "python_version=${PYTHON_VERSION}" >> "$GITHUB_OUTPUT"
          echo "invariant_version=${INVARIANT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag,pattern=v(.*),group=1
            type=sha

      - name: Validate version matches git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$TAG_VERSION" != "${{ steps.versions.outputs.invariant_version }}" ]; then
            echo "❌ Git tag v$TAG_VERSION does not match invariant version ${{ steps.versions.outputs.invariant_version }}"
            exit 1
          fi

      # ---- BUILD (SBOM ENABLED) ----
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true                 # ✅ SBOM generated
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- IMAGE SIGNING ----
      - name: Sign the published Docker image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

      # ---- SBOM ATTESTATION ----
      - name: Cosign attest SBOM
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          cosign attest \
            --yes \
            --predicate <(cosign download sbom ${IMAGE}@${DIGEST}) \
            --type spdx \
            ${IMAGE}@${DIGEST}
